name: ci

# Nightly instead of on every push (2026-10-26: "For CI commits, please run
# only nightly CI builds"); version tags still build and release at once, and
# a run can be started by hand.
on:
  schedule:
    - cron: "17 2 * * *"  # 02:17 UTC
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # A nightly run without commits in the last day builds nothing.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-13, os: ubuntu-24.04, cxx: g++-13 }
          - { name: gcc-14, os: ubuntu-24.04, cxx: g++-14 }
          - { name: clang-19, os: ubuntu-24.04, cxx: clang++-19 }
          - { name: msvc, os: windows-2022, cxx: cl }
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # Clang 18 cannot use libstdc++'s <expected>; 19 can.
      - name: install clang 19
        if: matrix.name == 'clang-19'
        run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 19
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  sanitizers:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-14 -DLISBENCH_SANITIZE=address,undefined
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-tidy==19.1.0 clang-format==19.1.0
      - run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')
      - name: type-check the web UI script (no build step, tsc only checks)
        run: npx --yes -p typescript@5.6.3 tsc --noEmit --allowJs --checkJs --strict --target es2022 --module es2022 --lib es2022,dom,dom.iterable web/app.js web/sessions.js web/knowledge.js
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: cmake --build build --target lisbench
      # The database comes from GCC; its GCC-only warning flags are unknown to clang.
      - run: clang-tidy -p build --extra-arg=-Wno-unknown-warning-option $(git ls-files 'src/*.cpp' 'apps/*.cpp')

  fuzz:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 19
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++-19 -DLISBENCH_BUILD_TESTS=OFF -DLISBENCH_BUILD_FUZZERS=ON
      - run: cmake --build build
      - name: run each fuzzer for 60 s
        run: |
          for f in fuzz_deframe fuzz_lis02_parse fuzz_link; do
            mkdir -p corpus/$f
            ./build/fuzz/$f -max_total_time=60 -max_len=4096 corpus/$f
          done

  arduino:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr esp32:esp32
      - name: compile the instrument sketches
        run: |
          arduino-cli compile --fqbn arduino:avr:uno --warnings all --library devsim/LisDevice devsim/LisDevice/examples/uno_analyzer
          arduino-cli compile --fqbn arduino:avr:uno --warnings all --library devsim/LisDevice --build-property "compiler.cpp.extra_flags=-DLISDEV_FAST_TEST=1" devsim/LisDevice/examples/uno_analyzer
          arduino-cli compile --fqbn arduino:avr:uno --warnings all --library devsim/LisDevice --build-property "compiler.cpp.extra_flags=-DLISDEV_HOST_QUERY=1" devsim/LisDevice/examples/uno_analyzer
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all --library devsim/LisDevice devsim/LisDevice/examples/esp32_analyzer

  # Debian packages for the Raspberry Pi (arm64, armhf) and PCs (amd64), built
  # on Debian 13 like Raspberry Pi OS. ARM builds are cross-compiled; their
  # tests run under qemu-user. Cases with sub-second real-time limits are left
  # to the native jobs above, since emulated time is too uneven for them.
  packages:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: deb-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, packages: "", toolchain: "", emulator: "" }
          - { arch: arm64, packages: "g++-aarch64-linux-gnu qemu-user", toolchain: "-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm64.cmake", emulator: "qemu-aarch64 -L /usr/aarch64-linux-gnu" }
          - { arch: armhf, packages: "g++-arm-linux-gnueabihf qemu-user", toolchain: "-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/armhf.cmake", emulator: "qemu-arm -L /usr/arm-linux-gnueabihf" }
    steps:
      - name: tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build g++ ca-certificates dpkg-dev file ${{ matrix.packages }}
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLISBENCH_DEVICES_DIR=/usr/share/lisbench/devices ${{ matrix.toolchain }}
      - run: cmake --build build
      - name: tests (on ${{ matrix.arch }})
        run: ${{ matrix.emulator }} build/tests/lisbench_tests "~conform*" "~web API*" "~*e2e*" "~command queue*"
      - name: smoke test of the binary
        run: |
          file build/lisbench
          ${{ matrix.emulator }} build/lisbench --version
          ${{ matrix.emulator }} build/lisbench decode --profile docs/devices/cepheid-genexpert/profile.yaml docs/devices/cepheid-genexpert/examples/results.astm | grep -F "β-lactamase"
      - run: cd build && cpack -G DEB
      - name: package contents
        run: |
          dpkg-deb --info build/lisbench_*_${{ matrix.arch }}.deb
          dpkg-deb --contents build/lisbench_*_${{ matrix.arch }}.deb
      - name: install, run and remove (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          apt-get install -y ./build/lisbench_*_amd64.deb
          lisbench --version
          getent passwd lisbench
          test -f /var/lib/lisbench/results.astm
          lisbench decode --profile cepheid-genexpert /usr/share/lisbench/devices/cepheid-genexpert/examples/results.astm | grep -F "β-lactamase"
          (lisbench serve --http 127.0.0.1:8080 --captures /var/lib/lisbench & echo $! > /tmp/pid; sleep 1; true)
          apt-get install -y --no-install-recommends curl
          curl -sf http://127.0.0.1:8080/ | grep -q "<title>lisbench</title>"
          curl -sf http://127.0.0.1:8080/api/files | grep -q results.astm
          kill "$(cat /tmp/pid)"
          apt-get purge -y lisbench
          ! getent passwd lisbench
          test ! -e /var/lib/lisbench
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: build/lisbench_*_${{ matrix.arch }}.deb

  # On a version tag: create the release from CHANGELOG.md and attach the packages.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [changes, build, sanitizers, lint, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v v="## ${tag#v} " 'index($0, v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes-file notes.md
          gh release upload "$tag" dist/*.deb --clobber
